name: Deploy WANDASTAR

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          key_path="$RUNNER_TEMP/hostinger_ssh_key"
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY }}" | sed 's/\\n/\n/g' > "$key_path"
          chmod 600 "$key_path"
          echo "HOSTINGER_SSH_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key_path: ${{ env.HOSTINGER_SSH_KEY_PATH }}
          script: |
            ~/deploy-wandastar.sh
